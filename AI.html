<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal LLM Directory — Every Major AI Model</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      color-scheme: dark;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #04060d;
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* Deep Dark Cyber Grid & Ambient Glows */
    .dark-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(99, 102, 241, 0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(14, 165, 233, 0.045) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 90% 80% at 50% 20%, #000 45%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 20%, #000 45%, transparent 100%);
    }

    .glow-orb {
      position: fixed;
      border-radius: 9999px;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
      animation: drift 18s ease-in-out infinite alternate;
    }

    .orb-a {
      width: 520px;
      height: 520px;
      top: -150px;
      left: 8%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.5), transparent 70%);
    }

    .orb-b {
      width: 480px;
      height: 480px;
      top: 25%;
      right: 5%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.35), transparent 70%);
      animation-delay: -6s;
    }

    .orb-c {
      width: 540px;
      height: 540px;
      bottom: -160px;
      left: 32%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.35), transparent 70%);
      animation-delay: -11s;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(0.96); }
      100% { transform: translate(30px, -25px) scale(1.06); }
    }

    #starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .llm-card {
      background: linear-gradient(155deg, rgba(13, 19, 36, 0.88) 0%, rgba(9, 13, 26, 0.72) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(148, 163, 184, 0.14);
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.78), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .llm-card:hover {
      transform: translateY(-3px);
      border-color: rgba(129, 140, 248, 0.42);
      box-shadow: 0 26px 55px -14px rgba(0, 0, 0, 0.88), 0 0 24px -6px rgba(99, 102, 241, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="relative min-h-screen bg-[#04060d] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

  <div class="glow-orb orb-a" aria-hidden="true"></div>

  <div class="glow-orb orb-c" aria-hidden="true"></div>
  <canvas id="starfield" aria-hidden="true"></canvas>

        { name: 'Granite 3.2 (2B / 8B)', lab: 'IBM Research', group: 'More Labs', access: 'Open-Weights', tag: 'Enterprise Apache 2.0', accent: 'from-blue-600 to-indigo-700', url: 'https://www.ibm.com/granite', desc: 'Enterprise-grade, safety-audited Apache 2.0 models for business workflows.' },
        { name: 'Falcon 3 & Falcon 180B', lab: 'TII (Abu Dhabi)', group: 'More Labs', access: 'Open-Weights', tag: 'Open Sovereign LLM', accent: 'from-amber-500 to-yellow-600', url: 'https://falconllm.tii.ae/', desc: 'High-scale open-weights models trained on RefinedWeb datasets.' },
        { name: 'ERNIE 4.5 / X1', lab: 'Baidu', group: 'More Labs', access: 'Proprietary', tag: 'Knowledge-Enhanced', accent: 'from-blue-500 to-sky-600', url: 'https://yiyan.baidu.com/', desc: 'Baidu’s flagship knowledge-graph-augmented multimodal and reasoning LLM.' },
        { name: 'Doubao 1.5 Pro', lab: 'ByteDance', group: 'More Labs', access: 'Proprietary', tag: 'High-Scale Consumer AI', accent: 'from-cyan-500 to-indigo-600', url: 'https://www.doubao.com/', desc: 'ByteDance’s sparse MoE flagship model serving hundreds of millions of users.' },
        { name: 'MiniMax-01 (456B)', lab: 'MiniMax', group: 'More Labs', access: 'Open-Weights', tag: 'Lightning Attention 4M', accent: 'from-rose-500 to-pink-600', url: 'https://www.minimax.io/', desc: '456B parameter model using Lightning Attention for 4-million-token contexts.' },
        { name: 'Hunyuan-Large & Turbo', lab: 'Tencent', group: 'More Labs', access: 'Open-Weights', tag: '389B Open MoE', accent: 'from-sky-500 to-blue-700', url: 'https://hunyuan.tencent.com/', desc: 'Tencent’s 389B Mixture-of-Experts model supporting 256K context windows.' },
        { name: 'Solar Pro (22B)', lab: 'Upstage', group: 'More Labs', access: 'Open-Weights', tag: 'Depth Up-Scaled', accent: 'from-purple-500 to-indigo-600', url: 'https://console.upstage.ai/', desc: '22B Depth Up-Scaled model engineered to run on a single 80GB GPU.' },
      ];

      /* =========================================================================
         2. DARK COSMIC STARFIELD ANIMATION
         ========================================================================= */
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      let stars = [];

      function resizeStars() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const count = Math.min(130, Math.max(45, Math.floor((canvas.width * canvas.height) / 14000)));
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.6 + 0.3,
          a: Math.random() * 0.75 + 0.15,
          da: (Math.random() * 0.01 + 0.002) * (Math.random() > 0.5 ? 1 : -1),
          vy: -(Math.random() * 0.18 + 0.03),
          rgb: Math.random() > 0.65 ? '165, 180, 252' : '226, 232, 240',
        }));
      }

      function renderStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.y += s.vy;
          s.a += s.da;
          if (s.a > 0.88 || s.a < 0.12) s.da *= -1;
          if (s.y < -5) {
            s.y = canvas.height + 5;
            s.x = Math.random() * canvas.width;
          }
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${s.rgb}, ${Math.max(0.1, Math.min(0.9, s.a))})`;
          ctx.fill();
        }
        requestAnimationFrame(renderStars);
      }

      window.addEventListener('resize', resizeStars);
      resizeStars();
      renderStars();

      /* =========================================================================
         3. INTERACTIVE RENDERING, FILTERING & COPY HELPERS
         ========================================================================= */
      const grid = document.getElementById('llm-grid');
      const emptyState = document.getElementById('empty-state');
      const countBadge = document.getElementById('llm-count');
      const searchInput = document.getElementById('llm-search');
      const accessFilter = document.getElementById('access-filter');
      const toast = document.getElementById('toast');

      let activeGroup = 'All';
      let searchQuery = '';
      let accessType = 'All';
      let toastTimer = null;

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.remove('opacity-0', 'translate-y-4');
        toast.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-4');
          toast.classList.remove('opacity-100', 'translate-y-0');
        }, 2000);
      }

      function copyText(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast(`Copied: ${text}`);
        } catch (e) {
          showToast('Could not copy');
        }
        document.body.removeChild(ta);
      }

      function downloadFile(filename, content, mimeType) {
        const blob = new Blob([content], { type: mimeType || 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(`Downloaded ${filename}`);
      }

      function launchNewWindow(url, name) {
        const win = window.open(
          url,
          name || 'llmPortalWindow',
          'width=1280,height=840,menubar=no,toolbar=no,location=yes,status=no,resizable=yes,scrollbars=yes'
        );
        if (!win || win.closed || typeof win.closed === 'undefined') {
          window.open(url, '_blank', 'noopener,noreferrer');
        }
      }

      function renderLLMs() {
        const list = LLMS.filter((m) => {
          const groupOk = activeGroup === 'All' || m.group === activeGroup;
          const accessOk = accessType === 'All' || m.access === accessType;
          const qOk =
            !searchQuery ||
            m.name.toLowerCase().includes(searchQuery) ||
            m.lab.toLowerCase().includes(searchQuery) ||
            m.tag.toLowerCase().includes(searchQuery) ||
            m.desc.toLowerCase().includes(searchQuery);
          return groupOk && accessOk && qOk;
        });

        countBadge.textContent = list.length;
        grid.innerHTML = '';

        if (list.length === 0) {
          emptyState.classList.remove('hidden');
          return;
        }
        emptyState.classList.add('hidden');

        list.forEach((m) => {
          const isOpen = m.access === 'Open-Weights';
          const card = document.createElement('article');
          card.className = 'llm-card flex flex-col justify-between rounded-3xl p-5';
          card.innerHTML = `
            <div>
              <div class="mb-3.5 flex items-start justify-between gap-3">
                <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br ${m.accent} text-sm font-black text-white shadow-lg">
                  ${m.name.slice(0, 2).toUpperCase()}
                </div>
                <span class="rounded-lg border ${
                  isOpen
                    ? 'border-emerald-400/35 bg-emerald-500/15 text-emerald-200'
                    : 'border-indigo-400/35 bg-indigo-500/15 text-indigo-200'
                } px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider">
                  ${m.access}
                </span>
              </div>
              <div class="mb-1 flex flex-wrap items-center gap-2">
                <h2 class="text-base font-extrabold text-white">${m.name}</h2>
              </div>
              <p class="mb-2 text-xs font-semibold text-indigo-300">${m.lab} • <span class="text-slate-400">${m.tag}</span></p>
              <p class="text-xs leading-relaxed text-slate-400">${m.desc}</p>
            </div>
            <div class="mt-5 grid grid-cols-3 gap-1.5 border-t border-slate-800/80 pt-3.5">
              <button
                type="button"
                class="win-llm-btn inline-flex items-center justify-center rounded-xl bg-indigo-500 px-2 py-2 text-[11px] font-bold text-white shadow-md shadow-indigo-500/20 transition hover:bg-indigo-400 active:scale-95"
                title="Open in New Window"
              >
                <span>New Window</span>
              </button>
              <a
                href="${m.url}"
                target="_blank"
                rel="noopener noreferrer"
                class="inline-flex items-center justify-center rounded-xl border border-indigo-400/35 bg-indigo-500/15 px-2 py-2 text-[11px] font-bold text-indigo-200 transition hover:bg-indigo-500/25 active:scale-95"
                title="Open in New Tab"
              >
                <span>New Tab</span>
              </a>
              <button
                type="button"
                class="dl-llm-btn inline-flex items-center justify-center rounded-xl border border-emerald-400/35 bg-emerald-500/15 px-2 py-2 text-[11px] font-bold text-emerald-200 transition hover:bg-emerald-500/25 active:scale-95"
                title="Download Model Shortcut"
              >
                <span>Download</span>
              </button>
            </div>
          `;
          card.querySelector('.win-llm-btn').addEventListener('click', () => {
            try {
              launchNewWindow(m.url, `llm_${m.name.replace(/\W+/g, '_')}`);
            } catch (err) {
              window.open(m.url, '_blank', 'noopener,noreferrer');
            }
          });
          card.querySelector('.dl-llm-btn').addEventListener('click', () => {
            try {
              const slug = m.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
              const shortcutHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=${m.url}" />
  <title>${m.name} — ${m.lab}</title>
</head>
<body style="background:#04060d;color:#f8fafc;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Launching <strong>${m.name}</strong> (${m.lab})... <a href="${m.url}" style="color:#818cf8;">Click here if not redirected</a></p>
</body>
</html>`;
              downloadFile(`${slug}.html`, shortcutHtml, 'text/html;charset=utf-8');
            } catch (err) {
              showToast('Download failed in this browser context');
            }
          });
          grid.appendChild(card);
        });
      }

      document.querySelectorAll('.filter-pill').forEach((pill) => {
        pill.addEventListener('click', () => {
          activeGroup = pill.getAttribute('data-filter');
          document.querySelectorAll('.filter-pill').forEach((p) => {
            p.classList.remove('active', 'bg-indigo-500', 'text-white', 'shadow-md', 'shadow-indigo-500/25');
            p.classList.add('border', 'border-slate-800', 'bg-slate-950/80', 'text-slate-300');
          });
          pill.classList.add('active', 'bg-indigo-500', 'text-white', 'shadow-md', 'shadow-indigo-500/25');
          pill.classList.remove('border', 'border-slate-800', 'bg-slate-950/80', 'text-slate-300');
          renderLLMs();
        });
      });

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        renderLLMs();
      });

      accessFilter.addEventListener('change', (e) => {
        accessType = e.target.value;
        renderLLMs();
      });

      document.getElementById('clear-filters-btn').addEventListener('click', () => {
        activeGroup = 'All';
        searchQuery = '';
        accessType = 'All';
        searchInput.value = '';
        accessFilter.value = 'All';
        document.querySelector('.filter-pill[data-filter="All"]').click();
      });

      document.getElementById('random-llm-btn').addEventListener('click', () => {
        const pick = LLMS[Math.floor(Math.random() * LLMS.length)];
        showToast(`Spotlight: ${pick.name} by ${pick.lab}`);
        searchInput.value = pick.name;
        searchQuery = pick.name.toLowerCase();
        renderLLMs();
      });

      document.getElementById('download-html-btn').addEventListener('click', () => {
        const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        downloadFile('llm_directory.html', fullHtml, 'text/html;charset=utf-8');
      });

      renderLLMs();
    })();
  </script>
</body>
</html>
