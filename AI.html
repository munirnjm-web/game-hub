<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Launcher — ChatGPT &amp; Google AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    html, body {
      min-height: 100%;
      overflow-x: hidden;
      background-color: #070b14;
      color: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen bg-[#070b14] text-slate-100 font-sans antialiased flex items-center justify-center p-4 sm:p-8">
  <!-- Main Launcher Container -->
  <main class="w-full max-w-4xl">
    <header class="text-center mb-8 sm:mb-10">
      <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white">
        AI Launcher
      </h1>
      <p class="mt-2 text-sm sm:text-base text-slate-400">
        Select an assistant to open in this tab
      </p>
    </header>

    <!-- Two Side-by-Side Same-Tab Tiles -->
    <section aria-label="AI Assistants" class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6">
      <!-- ChatGPT Tile -->
      <a
        id="chatgpt-tile"
        href="https://chatgpt.com/"
        target="_self"
        class="group flex flex-col justify-between rounded-3xl border border-slate-800 bg-slate-900/90 p-6 sm:p-8 shadow-xl transition duration-200 hover:-translate-y-1 hover:border-emerald-400/60 hover:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-400/60"
      >
        <div>
          <div class="flex items-center justify-between gap-3 mb-6">
            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-500/15 border border-emerald-400/30 text-emerald-300 shadow-inner transition group-hover:scale-105 group-hover:bg-emerald-500/25">
              <!-- Clean ChatGPT Spark/Mark SVG -->
              <svg viewBox="0 0 24 24" class="h-7 w-7 fill-current" role="img" aria-label="ChatGPT icon">
                <path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.582a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z" />
              </svg>
            </div>
            <span class="text-xs font-medium text-slate-400">chatgpt.com</span>
          </div>

          <h2 class="text-xl sm:text-2xl font-extrabold text-white group-hover:text-emerald-300 transition">
            ChatGPT
          </h2>
          <p class="mt-1.5 text-sm text-slate-400">
            Open ChatGPT in this tab
          </p>
        </div>

        <div class="mt-6 flex items-center justify-between pt-4 border-t border-slate-800/90 text-xs font-semibold text-emerald-400">
          <span>Same Tab</span>
          <span aria-hidden="true" class="transition-transform group-hover:translate-x-1">&rarr;</span>
        </div>
      </a>

      <!-- Google AI Tile -->
      <a
        id="google-ai-tile"
        href="https://gemini.google.com/"
        target="_self"
        class="group flex flex-col justify-between rounded-3xl border border-slate-800 bg-slate-900/90 p-6 sm:p-8 shadow-xl transition duration-200 hover:-translate-y-1 hover:border-sky-400/60 hover:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-400/60"
      >
        <div>
          <div class="flex items-center justify-between gap-3 mb-6">
            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-sky-500/15 border border-sky-400/30 text-sky-300 shadow-inner transition group-hover:scale-105 group-hover:bg-sky-500/25">
              <!-- Clean 4-Point Sparkle Icon for Google AI -->
              <svg viewBox="0 0 24 24" class="h-7 w-7 fill-current" role="img" aria-label="Google AI icon">
                <path d="M12 2L14.6 9.4L22 12L14.6 14.6L12 22L9.4 14.6L2 12L9.4 9.4L12 2Z" />
              </svg>
            </div>
            <span class="text-xs font-medium text-slate-400">gemini.google.com</span>
          </div>

          <h2 class="text-xl sm:text-2xl font-extrabold text-white group-hover:text-sky-300 transition">
            Google AI
          </h2>
          <p class="mt-1.5 text-sm text-slate-400">
            Open Google AI in this tab
          </p>
        </div>

        <div class="mt-6 flex items-center justify-between pt-4 border-t border-slate-800/90 text-xs font-semibold text-sky-400">
          <span>Same Tab</span>
          <span aria-hidden="true" class="transition-transform group-hover:translate-x-1">&rarr;</span>
        </div>
      </a>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      // Strictly rely on native <a href="..." target="_self"> navigation
      // with zero window.open() calls or new-tab/new-window interception.
      document.addEventListener('DOMContentLoaded', () => {
        const chatgptLink = document.getElementById('chatgpt-tile');
        const googleAiLink = document.getElementById('google-ai-tile');
        if (chatgptLink) chatgptLink.setAttribute('target', '_self');
        if (googleAiLink) googleAiLink.setAttribute('target', '_self');
      });
    })();
  </script>
</body>
</html>
