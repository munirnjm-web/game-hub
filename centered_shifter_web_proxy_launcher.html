<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shifter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Configure Tailwind CSS for dark mode and clean Inter typography
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap');

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050811;
      color: #f8fafc;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      display: grid;
      place-items: center;
      padding: 16px;
      box-sizing: border-box;
    }

    .ambient-glow {
      position: fixed;
      border-radius: 9999px;
      filter: blur(95px);
      pointer-events: none;
      z-index: 0;
      animation: driftGlow 14s ease-in-out infinite alternate;
    }

    .glow-primary {
      width: 440px;
      height: 440px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(56, 189, 248, 0.55), rgba(14, 165, 233, 0));
      animation: pulseCenterGlow 9s ease-in-out infinite alternate;
    }
    /* Keep primary centerpiece glow anchored around screen center while gently pulsing */
    @keyframes pulseCenterGlow {
      0% {
        transform: translate(-50%, -50%) scale(0.96);
      }
      100% {
        transform: translate(-50%, -50%) scale(1.08);
      }
    }

    #starfield-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .shifter-card {
      background: linear-gradient(155deg, rgba(14, 116, 144, 0.36) 0%, rgba(15, 23, 42, 0.88) 55%, rgba(30, 58, 138, 0.42) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 0 0 1px rgba(56, 189, 248, 0.32),
        0 25px 70px -15px rgba(14, 165, 233, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }
  </style>
</head>
<body class="relative bg-[#050811] font-sans antialiased">
  <!-- Ambient Glow Layers -->
  <div class="ambient-glow glow-primary" aria-hidden="true"></div>
  <div class="ambient-glow glow-accent" aria-hidden="true"></div>
  <div class="ambient-glow glow-secondary" aria-hidden="true"></div>

  <!-- Subtle Animated Starfield Canvas -->
  <canvas id="starfield-canvas" aria-hidden="true"></canvas>

  <!-- Dead-Centered Shifter Card -->
  <main class="relative z-10 w-full max-w-md">
    <section
      aria-label="Shifter Launcher"
      class="shifter-card flex w-full flex-col items-center justify-center rounded-3xl px-7 py-8 sm:px-9 sm:py-10 text-center"
    >
      <!-- Shifter Site Logo with Clean Custom SVG Fallback -->
      <div class="mb-4 flex h-24 w-24 sm:h-28 sm:w-28 items-center justify-center overflow-hidden rounded-3xl border border-sky-300/40 bg-sky-500/15 p-4 text-sky-200 shadow-xl shadow-sky-600/25">
        <img
          id="shifter-logo-img"
          src="https://www.google.com/s2/favicons?domain=shifter.io&sz=128"
          alt="Shifter"
          class="h-full w-full rounded-2xl object-contain"
          onerror="this.style.display='none'; document.getElementById('shifter-fallback-svg').classList.remove('hidden');"
        />
        <svg
          id="shifter-fallback-svg"
          viewBox="0 0 24 24"
          class="hidden h-14 w-14 sm:h-16 sm:w-16 fill-none stroke-current"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 2.5L4.5 6v5.8c0 5.1 3.2 9.7 7.5 11.2 4.3-1.5 7.5-6.1 7.5-11.2V6L12 2.5z" />
          <circle cx="12" cy="11.5" r="3.5" />
          <path d="M8.6 11.5h6.8" />
        </svg>
      </div>

      <h1 class="mb-6 text-2xl sm:text-3xl font-black tracking-tight text-white">Shifter</h1>

      <!-- Three Launch Action Buttons -->
      <div class="grid w-full grid-cols-1 gap-3 sm:grid-cols-3">
        <!-- New Window -->
        <button
          type="button"
          id="btn-new-window"
          class="inline-flex items-center justify-center gap-2 rounded-2xl bg-sky-500 px-4 py-3 text-sm font-bold text-slate-950 shadow-lg shadow-sky-500/30 transition duration-150 hover:bg-sky-400 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-sky-300"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2.5" />
            <path d="M3 9h18" />
          </svg>
          <span>New Window</span>
        </button>

        <!-- New Tab -->
        <a
          href="https://shifter.io/web-proxy"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center justify-center gap-2 rounded-2xl border border-sky-300/35 bg-sky-500/15 px-4 py-3 text-sm font-bold text-sky-100 transition duration-150 hover:bg-sky-500/25 hover:border-sky-300/60 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-sky-300"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            <polyline points="15 3 21 3 21 9" />
            <line x1="10" y1="14" x2="21" y2="3" />
          </svg>
          <span>New Tab</span>
        </a>

        <!-- Same Tab -->
        <a
          href="https://shifter.io/web-proxy"
          target="_self"
          class="inline-flex items-center justify-center gap-2 rounded-2xl border border-slate-600/60 bg-slate-800/75 px-4 py-3 text-sm font-bold text-slate-100 transition duration-150 hover:bg-slate-700/80 hover:border-slate-500 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-sky-300"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
          <span>Same Tab</span>
        </a>
      </div>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      // Open Shifter in a dedicated separate browser window
      const newWindowBtn = document.getElementById('btn-new-window');
      if (newWindowBtn) {
        newWindowBtn.addEventListener('click', function () {
          const popup = window.open(
            'https://shifter.io/web-proxy',
            'shifterWindow',
            'width=1200,height=800,menubar=no,toolbar=no,location=yes,status=no,resizable=yes,scrollbars=yes'
          );
          if (!popup) {
            window.open('https://shifter.io/web-proxy', '_blank', 'noopener,noreferrer');
          }
        });
      }

      // Subtle animated stars in the background
      const canvas = document.getElementById('starfield-canvas');
      const ctx = canvas ? canvas.getContext('2d') : null;
      let stars = [];

      function initStars() {
        if (!canvas) return;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const count = Math.min(90, Math.max(30, Math.floor((canvas.width * canvas.height) / 18000)));
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.6 + 0.5,
          alpha: Math.random() * 0.65 + 0.15,
          deltaAlpha: (Math.random() * 0.012 + 0.003) * (Math.random() > 0.5 ? 1 : -1),
          vy: -(Math.random() * 0.18 + 0.04),
        }));
      }

      function renderStars() {
        if (ctx && canvas && canvas.width > 0 && canvas.height > 0) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            s.y += s.vy;
            s.alpha += s.deltaAlpha;

            if (s.alpha >= 0.85 || s.alpha <= 0.12) {
              s.deltaAlpha *= -1;
            }
            if (s.y < -4) {
              s.y = canvas.height + 4;
              s.x = Math.random() * canvas.width;
            }

            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(226, 232, 240, ${Math.max(0.1, Math.min(0.9, s.alpha))})`;
            ctx.fill();
          }
        }
        requestAnimationFrame(renderStars);
      }

      window.addEventListener('resize', initStars);
      initStars();
      renderStars();
    })();
  </script>
</body>
</html>
